# Extraction boundary and coordinate conventions of this gripper.
name: piper
robot_config: configs/robots/piper.yaml
root_prim: /Piper
base_body: link6
retained_bodies: [link6, link7, link8]
retained_joints: [joints/gripper_joint, joints/joint8]
tcp_parent_prim: link6/gripper_center
finger_colliders: [link7/collisions/gripper/mesh, link8/collisions/gripper/mesh]
approach_axis_base: [0.0, 0.0, 1.0]
opening_axis_base: [0.0, 1.0, 0.0]
contact_region:
  approach_interval_m: [0.075, 0.13]
  lateral_interval_m: [-0.007, 0.007]
  normal_alignment_min: 0.9
material:
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.0
  source: Piper USD fingertip PhysicsMaterial; other retained colliders use this explicit model.
  sensitivity_friction: [0.7, 1.0]
calibration: configs/calibration.yaml
wrist_up_axis_base: [-1.0, 0.0, 0.0]

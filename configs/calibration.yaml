# Shared physical calibration for the supported parallel-jaw grippers.
samples: 9
steps_per_second: 240
settle_steps: 720
position_tolerance_m: 0.0005
velocity_tolerance_m_s: 0.001
contact_probe_width_m: 0.04
contact_probe_depth_m: 0.016
contact_probe_height_m: 0.01
contact_probe_mass_kg: 0.05
hold_steps: 240
minimum_contact_force_N: 0.05
max_probe_translation_m: 0.003

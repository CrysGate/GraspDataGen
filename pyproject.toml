[project]
name = "graspdatagen"
version = "0.1.0"
description = "Grasp data generation experiments based on Isaac Sim and Isaac Lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "isaacsim[all,extscache]==5.1.0.0",
    "isaaclab[all]==2.3.2.post1",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
    "numpy<2",
    "matplotlib",
    "meshcat",
    "usd-core==26.5",
    "debugpy",
    "rich>=15.0.0",
    "warp-lang==1.12.1",
    "trimesh",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.uv.sources]
torch       = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio  = [{ index = "pytorch-cu128" }]
